<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mw-fav-fill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="38%" stop-color="#F43F5E" />
      <stop offset="70%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="mw-fav-stroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Main vibrant gradient triangle -->
  <polygon points="4,92 96,92 96,8" fill="url(#mw-fav-fill)" stroke-linejoin="miter" />
  <!-- Hypotenuse accent line -->
  <line x1="4" y1="92" x2="96" y2="8" stroke="url(#mw-fav-stroke)" stroke-width="4" stroke-linecap="round" />
  <!-- Crisp white border -->
  <polygon points="4,92 96,92 96,8" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linejoin="miter" />
  <!-- Inset right-angle marker -->
  <path d="M 96 74 L 78 74 L 78 92" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
  <!-- Apex point dot -->
  <circle cx="4" cy="92" r="4.5" fill="#FFFFFF" />
</svg>
