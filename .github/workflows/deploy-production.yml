name: Deploy to Production (AWS EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Transfer Artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "dist,package.json,package-lock.json,drizzle.config.ts,deploy,migrations,shared"
          target: "/home/ec2-user/app/meshwork-studio"
          rm: false

      - name: Run Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            chmod +x /home/ec2-user/app/meshwork-studio/deploy/deploy.sh
            cd /home/ec2-user/app/meshwork-studio
            ./deploy/deploy.sh

      - name: Production Health Check
        run: |
          HOST="${{ secrets.EC2_HOST }}"
          echo "Verifying health endpoint at http://$HOST/health..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$HOST/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production server is healthy!"
              exit 0
            fi
            echo "Attempt $i/15 — status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "FAIL: Production server health check failed"
          exit 1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: npx playwright test tests/e2e/ --grep "@smoke"
        env:
          BASE_URL: http://${{ secrets.EC2_HOST }}
        continue-on-error: true
