name: Deploy to Staging (AWS EC2)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy to Staging EC2
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Transfer Artifacts to Staging EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_STAGING_USER }}
          key: ${{ secrets.EC2_STAGING_SSH_KEY }}
          port: 22
          source: "dist,package.json,package-lock.json,drizzle.config.ts,deploy,migrations,shared"
          target: "/home/${{ secrets.EC2_STAGING_USER }}/meshwork-studiov2"
          rm: false

      - name: Run Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_STAGING_USER }}
          key: ${{ secrets.EC2_STAGING_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            TARGET="/home/${{ secrets.EC2_STAGING_USER }}/meshwork-studiov2"
            chmod +x "$TARGET/deploy/deploy.sh"
            cd "$TARGET"
            ./deploy/deploy.sh

      - name: Staging Health Check
        run: |
          HOST="${{ secrets.EC2_STAGING_HOST }}"
          echo "Verifying health endpoint at http://$HOST/health..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$HOST/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging server is healthy!"
              exit 0
            fi
            echo "Attempt $i/12 — status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "FAIL: Staging server health check failed"
          exit 1
