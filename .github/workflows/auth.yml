name: Auth Service

on:
  workflow_call:

concurrency:
  group: identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server/services/auth

env:
  GO_VERSION: "1.26.9"

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Verify configuration and lint
        run: |
          golangci-lint config verify
          golangci-lint run

  security:
    name: Security Scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: gosec
        run: gosec ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck ./...

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - run: go test ./... -race -count=1 -coverprofile=cover.out
      - run: go tool cover -func=cover.out | tail -1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Build identity image
        working-directory: server/services/auth
        run: docker build -t meshwork-identity:${{ github.sha }} .
