server {
    listen 80;
    server_name _;

    # ─── Gzip Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Static Frontend Assets ──────────────────────────────────────
    # Serve built React app directly from NGINX (faster than Node)
    location / {
        root /home/ec2-user/app/meshwork-studio/dist/public;
        try_files $uri $uri/ @node;
    }

    # Astro static landing. Exact match + direct file (NOT index directive:
    # index triggers an internal redirect that re-matches location / and
    # serves the SPA shell instead). Live path: <app>/landing/index.html.
    location = / {
        root /home/ec2-user/app/meshwork-studio/landing;
        try_files /index.html =404;
    }

    # Astro landing assets. Must precede the SPA fallback: without this,
    # the app shell (HTML) gets served as CSS and browsers refuse it.
    location /_astro/ {
        root /home/ec2-user/app/meshwork-studio/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No public metrics surface by design (loopback-only listener on the
    # app box, SSH tunnel to reach it). Deny explicitly so /metrics can
    # never fall through to the SPA catch-all and pretend to exist.
    location = /metrics {
        return 404;
    }

    # Never cache index.html (SPA entry point — must always be fresh)
    location = /index.html {
        root /home/ec2-user/app/meshwork-studio/dist/public;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Long-cache hashed static assets (Vite adds content hashes to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/ec2-user/app/meshwork-studio/dist/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @node;
    }

    # ─── Auth service (Go) ───────────────────────────────────────
    # Auth + user-profile surface is owned by server/services/auth (Go).
    location ~ ^/api/v1/(auth|user)/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1m;
    }

    # Admin dashboard: exact match BEFORE the SPA fallback so the Express
    # route (session + admin gate) serves it, not index.html.
    location = /admin {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API Routes → Node.js ────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request size limit (matches Express 5mb limit)
        client_max_body_size 5m;
    }

    # ─── WebSocket — Real-time Cursors ───────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout — keep alive for presence
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Health Check (no auth, fast) ────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    location /ready {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # ─── SPA Fallback → Node.js ──────────────────────────────────────
    # Any route not matching a static file falls through to the Node app
    # (handles SPA client-side routing + auth redirects)
    location @node {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}