name: emnesh-studio

services:
  # ─── Single Postgres instance, database-per-service ────────────────────
  # Isolation = credentials: each service's user opens exactly its own DB.
  # docker/postgres/init/01-databases.sh provisions them on first boot.
  emnesh-postgres:
    container_name: emnesh-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD required}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?WORKSPACE_DB_PASSWORD required}
      TEAM_DB_PASSWORD: ${TEAM_DB_PASSWORD:?TEAM_DB_PASSWORD required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD required}
      JENKOS_DB_PASSWORD: ${JENKOS_DB_PASSWORD:-${AI_DB_PASSWORD}}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?METRICS_DB_PASSWORD required}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Canvas documents (nodes/edges) — always-free tier, single table.
  emnesh-dynamodb-local:
    container_name: emnesh-dynamodb-local
    image: amazon/dynamodb-local:latest
    restart: always
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  emnesh-redis:
    container_name: emnesh-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emnesh-backend:
    container_name: emnesh-backend-api
    image: emnesh-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Database-per-service: each domain service gets ONLY its own DSN.
      WORKSPACE_DATABASE_URL: postgresql://workspace_app:${WORKSPACE_DB_PASSWORD}@emnesh-postgres:5432/workspace_db
      TEAM_DATABASE_URL: postgresql://team_app:${TEAM_DB_PASSWORD}@emnesh-postgres:5432/team_db
      AI_DATABASE_URL: postgresql://ai_app:${AI_DB_PASSWORD}@emnesh-postgres:5432/ai_db
      JENKOS_DATABASE_URL: postgresql://jenkos_app:${JENKOS_DB_PASSWORD:-${AI_DB_PASSWORD}}@emnesh-postgres:5432/jenkos_db
      METRICS_DATABASE_URL: postgresql://metrics_app:${METRICS_DB_PASSWORD}@emnesh-postgres:5432/metrics_db
      CANVAS_DDB_TABLE: ${CANVAS_DDB_TABLE:-meshwork-canvas}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DYNAMODB_ENDPOINT: http://emnesh-dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      # SECURITY: the monolith has NO auth_db access — it verifies Go-signed
      # assertion cookies locally with this public key only.
      AUTH_ASSERTION_PUBLIC_KEY: ${AUTH_ASSERTION_PUBLIC_KEY:?AUTH_ASSERTION_PUBLIC_KEY required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY required}
      AUTH_SERVICE_URL: http://emnesh-auth:8081
      REDIS_URL: redis://emnesh-redis:6379
      NODE_ENV: production
      # SECURITY: secrets MUST come from the deployment environment (.env /
      # SSM / Vault). No known defaults are accepted anymore.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:5000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      emnesh-postgres:
        condition: service_healthy
      emnesh-dynamodb-local:
        condition: service_started
      emnesh-redis:
        condition: service_healthy

  # ─── Auth service (Go) — owns users/sessions/MFA/OAuth/audit ──────────
  emnesh-auth:
    container_name: emnesh-auth
    build:
      context: ./server/services/auth
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      AUTH_PORT: 8081
      APP_PUBLIC_URL: ${APP_URL:-http://localhost:5000}
      EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
      AUTH_DATABASE_URL: postgresql://auth_app:${AUTH_DB_PASSWORD}@emnesh-postgres:5432/auth_db
      AUTH_REDIS_URL: redis://emnesh-redis:6379
      AUTH_IP_HASH_KEY: ${AUTH_IP_HASH_KEY:?AUTH_IP_HASH_KEY required}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY required}
      AUTH_ASSERTION_PRIVATE_KEY: ${AUTH_ASSERTION_PRIVATE_KEY:?AUTH_ASSERTION_PRIVATE_KEY required}
      AUTH_ASSERTION_TTL: 5m
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY required}
      SESSION_ABSOLUTE_TTL: 336h
      SESSION_IDLE_TTL: 168h
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
    depends_on:
      emnesh-postgres:
        condition: service_healthy
      emnesh-redis:
        condition: service_healthy

  emnesh-frontend:
    container_name: emnesh-frontend
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist/public:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - emnesh-backend
      - emnesh-auth

volumes:
  pgdata_postgres:
  dynamodb_data:
  redis_data:
